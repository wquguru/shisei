# Public changelog: tools/build_site.py turns this into /changelog/ (+ /ja/ /en/ /ko/), an Atom feed per language and
# sitemap rows. CHANGELOG.md stays the maintainer log; this file is written for readers: what they can see or try now.
# Every entry carries title / desc / cta in English plus _zh, _ja and _ko; the build stops if one is missing or too long.
# tag: new | improve | announce | removed. link: an in-site path without language prefix (/, /changelog/, /pose/P001/),
# optionally with ?query and #hash; the build prefixes the reader's language. Newest first.
entries:
  - date: 2026-10-30
    tag: improve
    title: Save straight to your photos
    desc: On a phone, the button under a pose now saves the image to your photo album through the system share sheet. Where a browser can't do that, it shows how to save by pressing and holding the image.
    link: /
    cta: Open the gallery
    title_zh: 手机上直接存到相册
    desc_zh: 在手机上打开大图，底部按钮改成「保存到相册」，通过系统分享面板一步存进相册；浏览器不支持时会提示长按图片保存。
    cta_zh: 打开图库
    title_ja: 写真アプリに直接保存
    desc_ja: スマートフォンでは拡大表示の下のボタンから、共有シートを通して画像を写真に保存できるようになりました。対応していないブラウザでは長押しで保存する方法を表示します。
    cta_ja: ギャラリーを開く
    title_ko: 사진 앱에 바로 저장
    desc_ko: 휴대폰에서는 크게 보기 아래 버튼으로 공유 시트를 통해 이미지를 사진 앱에 바로 저장할 수 있습니다. 지원하지 않는 브라우저에서는 길게 눌러 저장하는 방법을 알려 줍니다.
    cta_ko: 갤러리 열기

  - date: 2026-10-30
    tag: improve
    title: A prompt for every pose
    desc: Upper-body, suggestive and two-figure poses now show a copyable English pose description in the viewer, the same one their drawings were generated from.
    link: /
    cta: Open the gallery
    title_zh: 每个姿势都有提示词了
    desc_zh: 上半身、性感和双人系列的姿势，打开大图后也能复制英文姿势描述了，就是当初生成这些线稿时用的那一段。
    cta_zh: 打开图库
    title_ja: すべてのポーズにプロンプト
    desc_ja: 上半身・セクシー・2人のポーズでも、拡大表示から英語のポーズ説明をコピーできるようになりました。線画の生成に使った文そのものです。
    cta_ja: ギャラリーを開く
    title_ko: 모든 포즈에 프롬프트
    desc_ko: 상반신·섹시·2인 포즈도 크게 보기에서 영어 포즈 설명을 복사할 수 있습니다. 선화를 생성할 때 쓴 바로 그 문장입니다.
    cta_ko: 갤러리 열기

  - date: 2026-10-29
    tag: announce
    title: How Shisei was made
    desc: A link above the title on the home page opens the making-of article on X (in Chinese) on how the whole library was built in 21 hours.
    link: /
    cta: Open the gallery
    title_zh: 这套图库是怎么做出来的
    desc_zh: 首页标题上方新增入口，点开就是 X 上的制作长文：21 小时从零做出整套图库的完整方法。
    cta_zh: 打开图库
    title_ja: Shisei のメイキング
    desc_ja: トップページのタイトル上に、ポーズ集全体を 21 時間で作った方法をまとめた X の記事（中国語）へのリンクを追加しました。
    cta_ja: ギャラリーを開く
    title_ko: Shisei 제작기
    desc_ko: 홈 제목 위에 21시간 만에 자료 전체를 만든 과정을 정리한 X 글(중국어)로 가는 링크를 추가했습니다.
