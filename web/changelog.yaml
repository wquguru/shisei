# Public changelog: tools/build_site.py turns this into /changelog/ (+ /ja/ /en/ /ko/), an Atom feed per language and
# sitemap rows. CHANGELOG.md stays the maintainer log; this file is written for readers: what they can see or try now.
# Every entry carries title / desc / cta in English plus _zh, _ja and _ko; the build stops if one is missing or too long.
# tag: new | improve | announce | removed. link: an in-site path without language prefix (/, /changelog/, /pose/P001/),
# optionally with ?query and #hash; the build prefixes the reader's language. Newest first.
entries:
  - date: 2026-10-29
    tag: new
    title: 43 pose sets redrawn, 25 back on show
    desc: Sets with at most two usable angles or the wrong pose were redrawn whole and checked again. Standard now shows 71 of 73 sets, upper body all 80. The new mannequin looks a little different.
    link: /
    cta: Open the gallery
    title_zh: 重画 43 套姿势，25 套重新上架
    desc_zh: 原来只有两个以下可用机位、或画错姿势的套，整套重画并重新质检。标准系现在显示 73 套里的 71 套，上半身 80 套全部显示。新画的素体略有不同。
    cta_zh: 打开画廊
    title_ja: 43 セットを描き直し、25 セットが復活
    desc_ja: 使えるアングルが 2 つ以下、またはポーズが違っていたセットをセットごと描き直し、改めて品質チェックしました。標準は 73 セット中 71、上半身は 80 セットすべてを表示します。新しい絵はマネキンが少し違います。
    cta_ja: ギャラリーを開く
    title_ko: 43개 세트를 다시 그려 25개 세트 복귀
    desc_ko: 쓸 수 있는 앵글이 2개 이하이거나 포즈가 틀렸던 세트를 세트 단위로 다시 그리고 품질 검사를 다시 했습니다. 표준은 73개 중 71개, 상반신은 80개 모두 표시합니다. 새 그림은 마네킹이 조금 다릅니다.
    cta_ko: 갤러리 열기

  - date: 2026-10-29
    tag: improve
    title: More poses per screen on phones
    desc: Phones get three columns, about 11 poses per screen, with the angle switch in the top bar instead of a filter panel. The large view fills the screen, with download and next pose in reach.
    link: /
    cta: Open the gallery
    title_zh: 手机上一屏能看更多姿势
    desc_zh: 手机上画廊改成三列，一屏大约 11 套，机位切换放在顶部吸顶条，不用再打开筛选面板。大图全屏显示，下载和下一套按钮都在手边，不用滚动。
    cta_zh: 打开画廊
    title_ja: スマホで一画面に多くのポーズを
    desc_ja: スマホではギャラリーが 3 列になり、一画面に約 11 ポーズ。アングル切り替えは上部のバーにあり、絞り込みパネルは不要になりました。拡大表示は全画面で、ダウンロードと次のポーズにすぐ手が届きます。
    cta_ja: ギャラリーを開く
    title_ko: 휴대폰에서 한 화면에 더 많은 포즈를
    desc_ko: 휴대폰에서 갤러리가 3열로 바뀌어 한 화면에 약 11개 포즈가 보입니다. 앵글 전환은 상단 바에 있어 필터 패널이 필요 없습니다. 크게 보기는 전체 화면이고 다운로드와 다음 포즈 버튼이 바로 손 닿는 곳에 있습니다.
    cta_ko: 갤러리 열기

  - date: 2026-10-29
    tag: new
    title: Line art and photo side by side
    desc: Poses with photos get a Compare option in the large view and a side-by-side section on their pose page, to see how the line art becomes a body at the same angle. L cycles line art, photo and compare.
    link: /pose/P001/
    cta: See P001 compared
    title_zh: 线稿和实拍可以并排对比了
    desc_zh: 有实拍的姿势，大图里多了「对比」，姿势页也加了一节并排对照，同一机位下线稿怎么变成真人一眼就能看清。按 L 在线稿、实拍、对比之间切换。
    cta_zh: 看 P001 的对比
    title_ja: 線画と実写を並べて比較
    desc_ja: 実写のあるポーズは、拡大表示に「比較」が加わり、ポーズページにも並べて見る欄ができました。同じアングルで線画がどう人体になるかがすぐ分かります。L キーで線画・実写・比較を切り替えます。
    cta_ja: P001 の比較を見る
    title_ko: 선화와 실사를 나란히 비교
    desc_ko: 실사가 있는 포즈는 크게 보기에 '비교'가 생겼고, 포즈 페이지에도 나란히 보는 섹션이 추가됐습니다. 같은 앵글에서 선화가 실제 몸으로 어떻게 바뀌는지 바로 보입니다. L 키로 선화, 실사, 비교를 오갑니다.
    cta_ko: P001 비교 보기

  - date: 2026-10-29
    tag: improve
    title: Angle arrows that always respond
    desc: In the large view, the ← → keys now keep switching angles after you click a thumbnail or the image. On poses with a single angle the arrows grey out instead of doing nothing.
    link: /
    cta: Open the gallery
    title_zh: 切换机位的左右箭头不再失灵
    desc_zh: 大图里点过缩略图或图片之后，← → 键依然能切换机位。只有一个机位的姿势，箭头会变灰，不再按了没反应。
    cta_zh: 打开画廊
    title_ja: 左右の矢印が確実に反応するように
    desc_ja: 拡大表示でサムネイルや画像をクリックしたあとも、← → キーでアングルを切り替えられます。アングルが 1 つだけのポーズでは矢印がグレーになります。
    cta_ja: ギャラリーを開く
    title_ko: 좌우 화살표가 항상 반응해요
    desc_ko: 크게 보기에서 썸네일이나 이미지를 클릭한 뒤에도 ← → 키로 앵글을 바꿀 수 있습니다. 앵글이 하나뿐인 포즈에서는 화살표가 회색으로 바뀝니다.
    cta_ko: 갤러리 열기

  - date: 2026-10-29
    tag: improve
    title: Download a whole series in one small zip
    desc: The download button now offers one zip per series or all of them, at a size that is quick on a phone. Originals are still there for tracing or print.
    link: /
    cta: Open the gallery
    title_zh: 一个压缩包下载整个系列
    desc_zh: 下载按钮现在可以按系列或一次下载全部，体积小，手机上也很快。需要描线或打印时，原图包依然可以下载。
    cta_zh: 打开画廊
    title_ja: シリーズ単位で軽い zip をダウンロード
    desc_ja: ダウンロードボタンからシリーズごと、またはすべてをまとめて取得できます。スマホでもすぐ終わるサイズです。原寸パックも引き続き用意しています。
    cta_ja: ギャラリーを開く
    title_ko: 시리즈 전체를 가벼운 zip 하나로
    desc_ko: 다운로드 버튼에서 시리즈별 또는 전체를 한 번에 받을 수 있습니다. 휴대폰에서도 금방 받는 크기이며, 원본 묶음도 그대로 받을 수 있습니다.
    cta_ko: 갤러리 열기

  - date: 2026-10-28
    tag: new
    title: Share any pose, with its own preview card
    desc: Every pose now has its own page with all five angles and its names in four languages. Share it and the link preview shows that pose.
    link: /pose/P064/
    cta: Open a pose page
    title_zh: 每套姿势都能单独分享
    desc_zh: 每套姿势都有自己的页面，五个机位和四种语言的名称都在上面。分享到微博、X 或 Pinterest 时，预览图就是这套姿势。
    cta_zh: 打开一套姿势
    title_ja: ポーズごとに共有できるように
    desc_ja: すべてのポーズに専用ページができました。5 アングルと 4 言語の名前を掲載。X・LINE・Pinterest に共有するとプレビューにそのポーズが表示されます。
    cta_ja: ポーズページを開く
    title_ko: 포즈마다 따로 공유할 수 있어요
    desc_ko: 모든 포즈에 전용 페이지가 생겼습니다. 5개 앵글과 4개 언어 이름을 담았고, X·LINE·Pinterest에 공유하면 미리보기에 그 포즈가 나옵니다.
    cta_ko: 포즈 페이지 열기

  - date: 2026-10-28
    tag: new
    title: 23 new lying, squatting, leaning, arching and twisting poses
    desc: Five lying, six squatting, six leaning forward, three arching back and three twisting poses, each drawn from five angles.
    link: /?new=1#all
    cta: See the new poses
    title_zh: 新增 23 套：躺、蹲、前倾、后仰、扭转
    desc_zh: 躺姿 5 套、蹲姿 6 套、前倾 6 套、后仰 3 套、扭转 3 套，每套都有五个机位。
    cta_zh: 看新增的姿势
    title_ja: 寝そべり・しゃがみ・前かがみ・反り・ひねりの 23 ポーズを追加
    desc_ja: 寝そべり 5、しゃがみ 6、前かがみ 6、反り 3、ひねり 3。どれも 5 アングルで描いています。
    cta_ja: 新しいポーズを見る
    title_ko: 눕기·쪼그려 앉기·숙이기·젖히기·비틀기 23개 추가
    desc_ko: 눕기 5개, 쪼그려 앉기 6개, 숙이기 6개, 젖히기 3개, 비틀기 3개. 모두 5개 앵글로 그렸습니다.
    cta_ko: 새 포즈 보기

  - date: 2026-10-28
    tag: announce
    title: The Shisei gallery is open
    desc: Browse 73 faceless mannequin poses, switch every card between five angles, search in four languages and download any view at 900×1200.
    link: /
    cta: Browse the gallery
    title_zh: Shisei 画廊上线
    desc_zh: 浏览 73 套无脸素体姿势，每张卡片都能在五个机位间切换，支持四种语言搜索，任意机位都能下载 900×1200 的图。
    cta_zh: 浏览画廊
    title_ja: Shisei ギャラリーを公開しました
    desc_ja: 顔なし素体の 73 ポーズを閲覧できます。カードごとに 5 アングルを切り替え、4 言語で検索し、どのアングルも 900×1200 でダウンロードできます。
    cta_ja: ギャラリーを見る
    title_ko: Shisei 갤러리를 열었습니다
    desc_ko: 얼굴 없는 마네킹 포즈 73가지를 둘러보세요. 카드마다 5개 앵글을 바꿔 보고, 4개 언어로 검색하고, 900×1200으로 내려받을 수 있습니다.
    cta_ko: 갤러리 둘러보기
