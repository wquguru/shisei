    cta_zh: 打开图库
    title_ja: ダウンロードを全ポーズに更新
    desc_ja: ダウンロード用の zip に、描き直した 43 セットを含む全 280 ポーズ、約 1,200 枚が入りました。ダウンロードボタンからシリーズごとでもまとめてでも取得できます。
    cta_ja: ギャラリーを開く
    title_ko: 모든 포즈를 담은 새 다운로드
    desc_ko: 다운로드 zip에 다시 그린 43세트를 포함해 280가지 포즈 전부, 약 1,200장을 담았습니다. 다운로드 버튼에서 시리즈별로 또는 한꺼번에 받을 수 있습니다.
    cta_ko: 갤러리 열기

