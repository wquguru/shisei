<!doctype html>
<html lang="__HTMLLANG__" data-loc="__LOC__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
__HEAD__
<meta name="theme-color" content="#F5F2ED">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="__BASE__app.css?v=__VERSION__">
</head>
<body>
<a class="skip" href="#all">__SKIP__</a>

<nav class="nav wrap" aria-label="Shisei">
  <a class="brand" href="./">
    <svg class="logo" width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#18181B"/><circle cx="60" cy="23" r="8" fill="none" stroke="#F5F2ED" stroke-width="6"/><path d="M57 37C38 52 42 68 64 82" fill="none" stroke="#E07A52" stroke-width="11" stroke-linecap="round"/></svg>
    <span>Shisei</span>
  </a>
  <div class="nav-links">
    <a href="#all" data-i18n="navPoses"></a>
    <button type="button" class="linklike" data-open="how" data-i18n="navHow"></button>
    <a href="__CHANGELOG__" data-i18n="navChangelog"></a>
  </div>
  <div class="nav-tools">
    <label class="search">
      <span class="sr" data-i18n="search"></span>
      <input id="q" type="search" autocomplete="off" data-i18n-ph="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
    <button type="button" class="circle" id="lang" data-i18n-aria="langLabel"></button>
    <button type="button" class="circle" id="theme" data-i18n-aria="theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="pill dark small" href="__REPO__">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>GitHub
    </a>
  </div>
</nav>

<main>
<header class="hero">
  <h1 data-i18n="heroTitle"></h1>
  <p class="hero-sub" data-i18n="heroSub"></p>
  <div class="marquee" aria-hidden="true">
    <div class="mq-row mq-l" id="mq1"></div>
    <div class="mq-row mq-r" id="mq2"></div>
  </div>
  <div class="cta">
    <a class="pill dark big" href="#all"><span data-i18n="browse"></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14m0 0-6-6m6 6 6-6"/></svg></a>
    <a class="pill light big" href="__REPO__/releases/latest">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span data-i18n="downloadAll"></span></a>
  </div>
  <div class="works">
    <span class="eyebrow" data-i18n="worksWith"></span>
    <div class="chips-static" id="tools"></div>
  </div>
</header>

<section class="wrap section" aria-labelledby="new-title">
  <div class="sec-head">
    <h2 id="new-title" data-i18n="newTitle"></h2>
    <button type="button" class="linkarrow" id="viewNew"><span data-i18n="viewAll"></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg></button>
  </div>
  <p class="sec-sub" data-i18n="newSub"></p>
  <div class="featured" id="featured"></div>
</section>

<section class="wrap section" id="all" aria-labelledby="all-title">
  <div class="sec-head">
    <h2 id="all-title" data-i18n="allTitle"></h2>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="filters">
    <div class="series-row">
      <div class="seg series" role="group" id="series"></div>
      <button type="button" class="chip adult" id="adult" aria-pressed="false"></button>
    </div>
    <div class="cats" role="tablist" id="cats"></div>
    <div class="filter-row">
      <div class="inline-filters" id="inlineFilters"></div>
      <button type="button" class="pill dark small sheet-btn" id="sheetBtn" aria-haspopup="dialog"><span data-i18n="filters"></span><b id="sheetBadge"></b></button>
    </div>
  </div>
  <div id="grid"></div>
</section>

__NOSCRIPT__
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div class="foot-brand">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#18181B"/><circle cx="60" cy="23" r="8" fill="none" stroke="#F5F2ED" stroke-width="7"/><path d="M57 37C38 52 42 68 64 82" fill="none" stroke="#E07A52" stroke-width="12" stroke-linecap="round"/></svg>
      <strong>Shisei 姿勢</strong>
      <span data-i18n="footer"></span>
    </div>
    <nav class="foot-links" aria-label="Footer">
      <a href="__REPO__">GitHub</a>
      <a href="__CHANGELOG__"><span data-i18n="navChangelog"></span> v__VERSION__</a>
      <a href="__BASE__catalog.json">catalog.json</a>
      <button type="button" class="linklike" data-share data-share-site data-i18n="shareSite"></button>
      <button type="button" class="linklike" data-open="terms" data-i18n="terms"></button>
    </nav>
  </div>
</footer>

<dialog class="lb" id="lb" aria-labelledby="lbTitle">
  <div class="lb-box">
    <div class="lb-stage" id="lbStage">
      <img id="lbImg" alt="">
      <div class="lb-missing" id="lbMissing" hidden></div>
      <button type="button" class="lb-nav l" id="lbPrev" data-i18n-aria="prevAngle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="lb-nav r" id="lbNext" data-i18n-aria="nextAngle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="lb-counter" id="lbCounter"></span>
    </div>
    <aside class="lb-side">
      <div class="lb-head">
        <span class="mono muted" id="lbMeta"></span>
        <h2 id="lbTitle"></h2>
        <dl class="lb-names" id="lbNames"></dl>
      </div>
      <div class="lb-chips" role="group" id="lbChips"></div>
      <div class="seg" role="group" id="lbMedium"></div>
      <div class="lb-desc" id="lbDescBox">
        <div class="lb-desc-h"><span data-i18n="descLabel"></span><button type="button" class="pill light tiny" id="lbCopyDesc" data-i18n="copy"></button></div>
        <p id="lbDesc"></p>
      </div>
      <div class="lb-actions">
        <a class="pill dark block" id="lbDl" download>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span id="lbDlText"></span></a>
        <div class="lb-row">
          <button type="button" class="pill light" id="lbCopyId" data-i18n="copyId"></button>
          <a class="pill light" href="__REPO__/releases/latest" data-i18n="fullZip"></a>
        </div>
        <div class="lb-row">
          <button type="button" class="pill light" id="lbShare">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span data-i18n="share"></span></button>
          <a class="pill light" id="lbPage" data-i18n="posePage"></a>
        </div>
        <p class="keys" data-i18n="keys"></p>
      </div>
    </aside>
    <button type="button" class="lb-close" id="lbClose" data-i18n-aria="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</dialog>

<dialog class="info" id="dlgHow" aria-labelledby="howT">
  <div class="info-h"><h2 id="howT" data-i18n="howTitle"></h2><button type="button" class="circle" data-close data-i18n-aria="close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <ul id="howList"></ul>
</dialog>
<dialog class="info" id="dlgTerms" aria-labelledby="termsT">
  <div class="info-h"><h2 id="termsT" data-i18n="termsTitle"></h2><button type="button" class="circle" data-close data-i18n-aria="close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <ul id="termsList"></ul>
</dialog>
<dialog class="sheet" id="sheet" aria-labelledby="sheetT">
  <span class="grip" aria-hidden="true"></span>
  <div class="info-h"><h2 id="sheetT" data-i18n="filters"></h2><button type="button" class="circle" data-close data-i18n-aria="close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div id="sheetFilters"></div>
  <div class="sheet-actions">
    <button type="button" class="pill light big" id="sheetReset" data-i18n="reset"></button>
    <button type="button" class="pill dark big" id="sheetApply"></button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="catalog" type="application/json">__CATALOG__</script>
<script>window.SHISEI = { repo: '__REPO__', version: '__VERSION__', base: '__BASE__', lang: '__LOC__' };</script>
<script src="__BASE__i18n.js?v=__VERSION__"></script>
<script src="__BASE__common.js?v=__VERSION__"></script>
<script src="__BASE__app.js?v=__VERSION__"></script>
</body>
</html>
