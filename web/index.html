        <span class="veil-ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9"/><path d="M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7c1.8 0 3.4-.6 4.8-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></span>

        <button type="button" class="pill dark" id="lbVeilOne"></button>
        <button type="button" class="pill light" id="lbVeilAll"></button>

        <h2 id="lbTitle"></h2>
        <dl class="lb-names" id="lbNames"></dl>
      </div>
      <div class="lb-chips" role="group" id="lbChips"></div>
      <div class="seg" role="group" id="lbMedium"></div>
      <div class="lb-desc" id="lbDescBox">
        <div class="lb-desc-h"><span data-i18n="descLabel"></span><button type="button" class="pill light tiny" id="lbCopyDesc" data-i18n="copy"></button></div>
        <p id="lbDesc"></p>
      </div>
      <div class="lb-actions">
        <div class="lb-dls">
        <div class="lb-pose">
          <button type="button" class="circle" id="lbPrevPose" data-i18n-aria="prevPose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>

        <a class="pill dark block" id="lbDl" download>

        </div>
        <div class="lb-row">
          <button type="button" class="pill light" id="lbCopyId" data-i18n="copyId"></button>
          <button type="button" class="pill light" data-open="dl" aria-haspopup="dialog" data-i18n="fullZip"></button>
        </div>
        <div class="lb-row">
