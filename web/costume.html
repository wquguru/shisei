<main>
<header class="wrap c-head">
  <p class="c-crumb"><a href="__HOME__" data-i18n="navPoses"></a><span aria-hidden="true">/</span><span data-c="nav"></span></p>
  <h1 id="cTitle"></h1>
  <p class="c-sub" data-c="sub"></p>
</header>

<section class="wrap c-sec" id="all" aria-labelledby="cTitle">
  <div class="filters c-filters">
    <div class="cats" role="tablist" id="cCats"></div>
    <div class="filter-row">
      <div class="inline-filters" id="cFilters"></div>
      <button type="button" class="chip adult" id="adult" role="switch" aria-checked="false"></button>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
  <div id="cGrid" class="cgrid"></div>
</section>
__NOSCRIPT__
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div class="foot-brand">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#18181B"/><circle cx="60" cy="23" r="8" fill="none" stroke="#F5F2ED" stroke-width="7"/><path d="M57 37C38 52 42 68 64 82" fill="none" stroke="#E07A52" stroke-width="12" stroke-linecap="round"/></svg>
      <strong>Shisei 姿勢</strong>
      <span data-i18n="footer"></span>
    </div>
    <nav class="foot-links" aria-label="Footer">
      <a href="__REPO__">GitHub</a>
      <a href="__CHANGELOG__"><span data-i18n="navChangelog"></span> v__VERSION__</a>
      <a href="__BASE__costumes.json">costumes.json</a>
    </nav>
  </div>
</footer>

<dialog class="clb" id="clb" aria-labelledby="clbTitle">
  <div class="clb-box">
    <div class="clb-stage" id="clbStage">
      <img id="clbImg" alt="">
      <div class="clb-gap" id="clbGap" hidden></div>
      <div class="lb-veil" id="clbVeil" hidden>
        <span class="veil-ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6 0 10 7 10 7a17 17 0 0 1-3.2 3.9"/><path d="M6.6 6.6C3.9 8.4 2 12 2 12s4 7 10 7c1.8 0 3.4-.6 4.8-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></span>
        <b id="clbVeilTitle"></b>
        <button type="button" class="pill dark" id="clbVeilOne"></button>
        <button type="button" class="pill light" id="clbVeilAll"></button>
      </div>
      <button type="button" class="lb-nav l" id="clbPrev" data-i18n-aria="prevAngle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button type="button" class="lb-nav r" id="clbNext" data-i18n-aria="nextAngle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="lb-counter" id="clbCounter"></span>
    </div>
    <aside class="clb-side">
      <div class="clb-head">
        <span class="mono muted" id="clbMeta"></span>
        <h2 id="clbTitle"></h2>
        <dl class="lb-names" id="clbNames"></dl>
      </div>
      <div class="lb-chips clb-chips" role="group" id="clbChips"></div>
      <div class="clb-acts">
        <button type="button" class="pill dark block" id="clbPair"></button>
        <div class="clb-row">
          <button type="button" class="circle" id="clbPrevItem" data-i18n-aria="prevPose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
          <button type="button" class="circle" id="clbNextItem" data-i18n-aria="nextPose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14m0 0-6-6m6 6 6-6"/></svg></button>
          <a class="pill light" id="clbDl" download><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span id="clbDlText"></span></a>
        </div>
      </div>
      <div class="lb-desc clb-desc" id="clbDescBox">
        <div class="lb-desc-h"><span data-c="descLabel"></span><button type="button" class="pill light tiny" id="clbCopy" data-i18n="copy"></button></div>
        <p id="clbDesc"></p>
      </div>
      <p class="keys" data-c="keys"></p>
    </aside>
    <button type="button" class="lb-close" id="clbClose" autofocus data-i18n-aria="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="costumes" type="application/json">__COSTUMES__</script>
